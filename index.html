<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Editor</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; color: #1f2937; }
    .field-label { display: block; font-weight: 600; margin-bottom: 8px; }
    .input-container { position: relative; width: 100%; }
    .text-input { width: 100%; padding: 10px 36px 10px 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .text-input:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
    .btn-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; padding: 4px; color: #9ca3af; cursor: pointer; display: none; align-items: center; justify-content: center; border-radius: 50%; width: 24px; height: 24px; transition: all 0.2s; font-size: 14px; line-height: 1; }
    .btn-clear:hover { background: #f3f4f6; color: #4b5563; }
    .btn-clear:focus-visible { outline: 2px solid #2563eb; color: #1f2937; }
    .btn-submit { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-submit:hover { background: #1d4ed8; }
    .btn-submit:focus-visible { outline: 3px solid #60a5fa; }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .banner { display: none; opacity: 0; transform: translateY(-8px); transition: opacity 0.3s ease, transform 0.3s ease; margin-top: 16px; padding: 12px; border-radius: 6px; background-color: #ecfdf5; color: #065f46; font-weight: 500; border: 1px solid #a7f3d0; }
    .banner.show { display: block; opacity: 1; transform: translateY(0); }
    .suggestions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .pill-btn { background: #f3f4f6; color: #4b5563; border: 1px solid #e5e7eb; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .pill-btn:hover { background: #e5e7eb; color: #1f2937; }
    .pill-btn:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
  </style>
</head>
<body>
  <h1 style="font-size: 1.8rem; margin-bottom: 12px;">AI Video Editor 🎬</h1>
  <p style="margin-bottom: 24px; color: #4b5563;">Create high-quality cuts with our AI engine.</p>
  <form id="editor-form" aria-label="Video generator" style="display: flex; flex-direction: column; gap: 16px;">
    <div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
        <label for="prompt" class="field-label" style="margin-bottom: 0;">
          AI Editing Prompt <span style="color: #dc2626;" aria-hidden="true">*</span>
        </label>
        <span id="char-counter" style="font-size: 0.8rem; color: #6b7280;" aria-live="polite">0 / 100</span>
      </div>
      <div class="input-container">
        <input id="prompt" class="text-input" type="text" required maxlength="100" placeholder="e.g., Trim silent parts and zoom in" />
        <button id="clear-btn" class="btn-clear" type="button" aria-label="Clear prompt" title="Clear prompt">×</button>
      </div>
      <div id="hint-text" style="font-size: 0.75rem; color: #9ca3af; margin-top: 4px; display: none; text-align: right;">Press <kbd style="background: #e5e7eb; padding: 1px 4px; border-radius: 3px; font-family: inherit;">Esc</kbd> to clear</div>
      <div class="suggestions">
        <button type="button" class="pill-btn" data-value="Trim silent parts" aria-label="Use suggestion: Trim silent parts">Trim silence ✂️</button>
        <button type="button" class="pill-btn" data-value="Add captions automatically" aria-label="Use suggestion: Add captions automatically">Add captions 💬</button>
        <button type="button" class="pill-btn" data-value="Zoom in on active speaker" aria-label="Use suggestion: Zoom in on active speaker">Auto-zoom 🔍</button>
      </div>
    </div>
    <button id="submit-btn" class="btn-submit" type="submit" aria-label="Generate video">
      Generate Video
    </button>
  </form>
  <div id="success-banner" class="banner" role="status" aria-live="polite"></div>
  <script>
    const form = document.getElementById('editor-form');
    const btn = document.getElementById('submit-btn');
    const banner = document.getElementById('success-banner');
    const input = document.getElementById('prompt');
    const charCounter = document.getElementById('char-counter');
    const hintText = document.getElementById('hint-text');
    const clearBtn = document.getElementById('clear-btn');

    function updateCountersAndHints() {
      const len = input.value.length;
      charCounter.textContent = `${len} / 100`;
      hintText.style.display = len > 0 ? 'block' : 'none';
      clearBtn.style.display = len > 0 ? 'flex' : 'none';
    }

    function clearStatusBanner() {
      banner.classList.remove('show');
      banner.style.display = 'none';
    }

    input.addEventListener('input', () => {
      updateCountersAndHints();
      clearStatusBanner();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && input.value.length > 0) {
        input.value = '';
        updateCountersAndHints();
        clearStatusBanner();
        e.preventDefault();
      }
    });

    clearBtn.addEventListener('click', () => {
      input.value = '';
      updateCountersAndHints();
      clearStatusBanner();
      input.focus();
    });

    document.querySelectorAll('.pill-btn').forEach(pill => {
      pill.addEventListener('click', () => {
        input.value = pill.getAttribute('data-value');
        updateCountersAndHints();
        clearStatusBanner();
        input.focus();
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" aria-hidden="true"></span> Generating...';
      btn.setAttribute('aria-label', 'Generating video, please wait');
      banner.classList.remove('show');
      banner.style.display = 'none';
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = 'Generate Video';
        btn.setAttribute('aria-label', 'Generate video');
        banner.textContent = '✨ AI video cuts generated successfully!';
        banner.style.display = 'block';
        // Force reflow for transitioning from display: none to block with transitions
        void banner.offsetWidth;
        banner.classList.add('show');
      }, 1200);
    });
  </script>
</body>
</html>
