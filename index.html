<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Editor</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; color: #1f2937; }
    .field-label { display: block; font-weight: 600; margin-bottom: 8px; }
    .text-input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .text-input:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
    .btn-submit { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-submit:hover { background: #1d4ed8; }
    .btn-submit:active:not(:disabled), .pill:active:not(:disabled) { transform: scale(0.96); }
    .btn-submit:focus-visible { outline: 3px solid #60a5fa; }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }
    .suggestions { display: flex; gap: 8px; margin-top: 8px; }
    .pill { background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 9999px; padding: 4px 10px; font-size: 0.82rem; cursor: pointer; color: #374151; transition: all 0.15s; }
    .pill:hover:not(:disabled) { background: #e5e7eb; color: #111827; }
    .pill:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
    .pill:disabled { opacity: 0.5; cursor: not-allowed; }
    .banner { display: none; margin-top: 16px; padding: 10px 12px; border-radius: 6px; background-color: #ecfdf5; color: #065f46; font-weight: 500; border: 1px solid #a7f3d0; align-items: center; justify-content: space-between; gap: 8px; }
    .btn-dismiss { background: transparent; border: none; color: #065f46; cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: 0.9rem; line-height: 1; transition: background 0.15s; }
    .btn-dismiss:hover { background: #d1fae5; }
    .btn-dismiss:active { transform: scale(0.95); }
    .btn-dismiss:focus-visible { outline: 2px solid #059669; }
    .btn-clear { position: absolute; right: 8px; background: transparent; border: none; color: #6b7280; font-size: 0.9rem; cursor: pointer; padding: 4px 8px; border-radius: 50%; line-height: 1; transition: background 0.15s, color 0.15s, transform 0.1s; }
    .btn-clear:hover:not(:disabled) { background: #e5e7eb; color: #111827; }
    .btn-clear:active:not(:disabled) { transform: scale(0.92); }
    .btn-clear:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
    .btn-clear:disabled { opacity: 0.5; cursor: not-allowed; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
  </style>
</head>
<body>
  <h1 style="font-size: 1.8rem; margin-bottom: 12px;">AI Video Editor 🎬</h1>
  <p style="margin-bottom: 24px; color: #4b5563;">Create high-quality cuts with our AI engine.</p>
  <form id="editor-form" aria-label="Video generator" style="display: flex; flex-direction: column; gap: 16px;">
    <div>
      <label for="prompt" class="field-label">
        AI Editing Prompt <span style="color: #dc2626;" aria-hidden="true">*</span>
      </label>
      <div class="input-container" style="position: relative; display: flex; align-items: center;">
        <input id="prompt" class="text-input" type="text" required placeholder="e.g., Trim silent parts and zoom in" style="padding-right: 36px;" />
        <button id="clear-btn" type="button" class="btn-clear" aria-label="Clear prompt text (Esc)" title="Clear prompt text (Esc)" style="display: none;">✕</button>
      </div>
      <div class="suggestions" aria-label="Preset prompt suggestions">
        <button type="button" class="pill" data-prompt="Trim silent parts" aria-label="Use suggestion: Trim silent parts" title="Use suggestion: Trim silent parts">✂️ Trim silences</button>
        <button type="button" class="pill" data-prompt="Auto-zoom on speaker" aria-label="Use suggestion: Auto-zoom on speaker" title="Use suggestion: Auto-zoom on speaker">🔍 Auto-zoom</button>
      </div>
    </div>
    <button id="submit-btn" class="btn-submit" type="submit" aria-label="Generate video">
      Generate Video
    </button>
  </form>
  <div id="status-announcer" class="sr-only" role="status" aria-live="polite"></div>
  <div id="success-banner" class="banner" role="status" aria-live="polite">
    <span id="banner-text">✨ AI video cuts generated successfully!</span>
    <button id="dismiss-btn" type="button" class="btn-dismiss" aria-label="Dismiss success message" title="Dismiss success message">✕</button>
  </div>
  <script>
    const form = document.getElementById('editor-form');
    const btn = document.getElementById('submit-btn');
    const promptInput = document.getElementById('prompt');
    const banner = document.getElementById('success-banner');
    const announcer = document.getElementById('status-announcer');
    const pills = document.querySelectorAll('.pill');
    const dismissBtn = document.getElementById('dismiss-btn');
    const clearBtn = document.getElementById('clear-btn');

    function updateClearBtnVisibility() {
      clearBtn.style.display = promptInput.value.trim().length > 0 ? 'inline-block' : 'none';
    }

    clearBtn.addEventListener('click', () => {
      promptInput.value = '';
      updateClearBtnVisibility();
      promptInput.focus();
      announcer.textContent = 'Prompt text cleared';
    });

    promptInput.addEventListener('input', updateClearBtnVisibility);

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && promptInput.value.length > 0) {
        promptInput.value = '';
        updateClearBtnVisibility();
        announcer.textContent = 'Prompt text cleared';
      }
    });

    dismissBtn.addEventListener('click', () => {
      banner.style.display = 'none';
      promptInput.focus();
      announcer.textContent = 'Success message dismissed';
    });

    pills.forEach(p => p.addEventListener('click', () => {
      promptInput.value = p.dataset.prompt;
      updateClearBtnVisibility();
      promptInput.focus();
      announcer.textContent = `Applied suggestion: ${p.dataset.prompt}`;
    }));

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      btn.disabled = true;
      clearBtn.disabled = true;
      pills.forEach(p => p.disabled = true);
      btn.innerHTML = 'Generating...';
      btn.setAttribute('aria-label', 'Generating video, please wait');
      banner.style.display = 'none';
      setTimeout(() => {
        btn.disabled = false;
        clearBtn.disabled = false;
        pills.forEach(p => p.disabled = false);
        btn.innerHTML = 'Generate Video';
        btn.setAttribute('aria-label', 'Generate video');
        banner.style.display = 'flex';
      }, 1200);
    });
  </script>
</body>
</html>
