<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Editor</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; color: #1f2937; }
    .field-label { display: block; font-weight: 600; margin-bottom: 8px; }
    .input-container { position: relative; width: 100%; }
    .text-input { width: 100%; padding: 10px 36px 10px 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .text-input:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
    .text-input:disabled { background: #f3f4f6; color: #9ca3af; cursor: not-allowed; }
    .btn-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; padding: 4px; color: #4b5563; cursor: pointer; display: none; align-items: center; justify-content: center; border-radius: 50%; width: 24px; height: 24px; transition: all 0.2s; font-size: 14px; line-height: 1; }
    .btn-clear:hover:not(:disabled) { background: #f3f4f6; color: #4b5563; }
    .btn-clear:focus-visible { outline: 2px solid #2563eb; color: #1f2937; }
    .btn-clear:disabled { color: #d1d5db; cursor: not-allowed; }
    .btn-submit { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-submit:hover:not(:disabled) { background: #1d4ed8; }
    .btn-submit:focus-visible { outline: 3px solid #60a5fa; }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .banner { display: none; opacity: 0; transform: translateY(-8px); transition: opacity 0.3s ease, transform 0.3s ease; margin-top: 16px; padding: 12px; border-radius: 6px; background-color: #ecfdf5; color: #065f46; font-weight: 500; border: 1px solid #a7f3d0; align-items: center; justify-content: space-between; gap: 8px; }
    .banner.show { display: flex; opacity: 1; transform: translateY(0); }
    .btn-close { background: none; border: none; padding: 4px; color: #047857; cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 50%; width: 24px; height: 24px; transition: all 0.2s; font-size: 16px; line-height: 1; margin-left: auto; }
    .btn-close:hover { background: rgba(4, 120, 87, 0.1); }
    .btn-close:focus-visible { outline: 2px solid #047857; }
    .suggestions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .pill-btn { background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
    .pill-btn:hover:not(:disabled) { background: #e5e7eb; color: #1f2937; }
    .pill-btn:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
    .pill-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .undo-bar { display: none; align-items: center; justify-content: space-between; font-size: 0.8rem; background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 6px 12px; border-radius: 6px; margin-top: 8px; }
    .btn-undo { background: none; border: none; color: #2563eb; font-weight: 600; cursor: pointer; padding: 2px 6px; border-radius: 4px; text-decoration: underline; }
    .btn-undo:hover:not(:disabled) { background: #dbeafe; color: #1d4ed8; }
    .btn-undo:focus-visible { outline: 2px solid #2563eb; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  </style>
</head>
<body>
  <h1 style="font-size: 1.8rem; margin-bottom: 12px;">AI Video Editor 🎬</h1>
  <p style="margin-bottom: 24px; color: #4b5563;">Create high-quality cuts with our AI engine.</p>
  <form id="editor-form" aria-label="Video generator" style="display: flex; flex-direction: column; gap: 16px;">
    <div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
        <label for="prompt" class="field-label" style="margin-bottom: 0;">
          AI Editing Prompt <span style="color: #dc2626;" aria-hidden="true">*</span>
        </label>
        <span id="char-counter" style="font-size: 0.8rem; color: #4b5563;" aria-hidden="true">0 / 100</span>
        <div id="sr-char-counter" class="sr-only" role="status" aria-live="polite">0 characters entered out of 100 maximum.</div>
      </div>
      <div class="input-container">
        <input id="prompt" class="text-input" type="text" required maxlength="100" placeholder="e.g., Trim silent parts and zoom in" />
        <button id="clear-btn" class="btn-clear" type="button" aria-label="Clear prompt" title="Clear prompt"><span aria-hidden="true">×</span></button>
      </div>
      <div id="hint-text" style="font-size: 0.75rem; color: #4b5563; margin-top: 4px; display: none; text-align: right;">Press <kbd style="background: #e5e7eb; padding: 1px 4px; border-radius: 3px; font-family: inherit;">Esc</kbd> to clear</div>
      <div id="undo-container" class="undo-bar" aria-live="polite" role="status">
        <span>Cleared prompt</span>
        <div style="display: flex; align-items: center; gap: 6px;">
          <button id="undo-btn" class="btn-undo" type="button" aria-label="Undo action and restore previous prompt">Undo</button>
          <kbd id="undo-shortcut" style="background: #dbeafe; border: 1px solid #bfdbfe; color: #1e40af; padding: 1px 4px; border-radius: 3px; font-size: 0.7rem; font-family: inherit;">Ctrl+Z</kbd>
        </div>
      </div>
      <div class="suggestions">
        <button type="button" class="pill-btn" data-value="Trim silent parts" aria-label="Use suggestion: Trim silent parts">Trim silence ✂️</button>
        <button type="button" class="pill-btn" data-value="Add captions automatically" aria-label="Use suggestion: Add captions automatically">Add captions 💬</button>
        <button type="button" class="pill-btn" data-value="Zoom in on active speaker" aria-label="Use suggestion: Zoom in on active speaker">Auto-zoom 🔍</button>
      </div>
    </div>
    <button id="submit-btn" class="btn-submit" type="submit" aria-label="Generate video">
      Generate Video
    </button>
  </form>
  <div id="success-banner" class="banner" role="status" aria-live="polite">
    <span id="success-message"></span>
    <button id="banner-close-btn" class="btn-close" type="button" aria-label="Dismiss message">×</button>
  </div>
  <script>
    const form = document.getElementById('editor-form');
    const btn = document.getElementById('submit-btn');
    const banner = document.getElementById('success-banner');
    const successMsg = document.getElementById('success-message');
    const bannerCloseBtn = document.getElementById('banner-close-btn');
    const input = document.getElementById('prompt');
    const charCounter = document.getElementById('char-counter');
    const srCharCounter = document.getElementById('sr-char-counter');
    const hintText = document.getElementById('hint-text');
    const clearBtn = document.getElementById('clear-btn');
    const pills = document.querySelectorAll('.pill-btn');
    const undoContainer = document.getElementById('undo-container');
    const undoBtn = document.getElementById('undo-btn');
    const undoShortcut = document.getElementById('undo-shortcut');

    let previousValue = '';
    let lastAnnouncedLength = 0;

    bannerCloseBtn.addEventListener('click', () => {
      clearStatusBanner();
    });

    function updateCountersAndHints() {
      const len = input.value.length;
      charCounter.textContent = `${len} / 100`;
      hintText.style.display = len > 0 ? 'block' : 'none';
      clearBtn.style.display = len > 0 ? 'flex' : 'none';

      if (len >= 90) {
        charCounter.style.color = '#dc2626';
        charCounter.style.fontWeight = '600';
      } else if (len >= 75) {
        charCounter.style.color = '#d97706';
        charCounter.style.fontWeight = 'normal';
      } else {
        charCounter.style.color = '#4b5563';
        charCounter.style.fontWeight = 'normal';
      }

      // Announcements for screen reader at important milestones (80, 90, 95, 100) or when cleared.
      const milestones = [80, 90, 95, 100];
      if (len === 0 && lastAnnouncedLength > 0) {
        srCharCounter.textContent = 'Prompt cleared. 0 characters entered.';
      } else if (milestones.includes(len) && len !== lastAnnouncedLength) {
        srCharCounter.textContent = `${len} characters entered out of 100 maximum.`;
      }
      lastAnnouncedLength = len;
    }

    function clearStatusBanner() {
      banner.classList.remove('show');
      banner.style.display = 'none';
    }

    function showUndo(oldVal, actionMessage) {
      if (!oldVal || oldVal.trim() === '') {
        hideUndo();
        return;
      }
      previousValue = oldVal;
      const span = undoContainer.querySelector('span');
      if (span) {
        span.textContent = actionMessage;
      }
      undoContainer.style.display = 'flex';
    }

    function hideUndo() {
      undoContainer.style.display = 'none';
    }

    input.addEventListener('input', () => {
      if (input.disabled) return;
      updateCountersAndHints();
      clearStatusBanner();
      hideUndo();
    });

    input.addEventListener('keydown', (e) => {
      if (input.disabled) return;
      if (e.key === 'Escape' && input.value.length > 0) {
        const oldVal = input.value;
        input.value = '';
        updateCountersAndHints();
        clearStatusBanner();
        showUndo(oldVal, 'Cleared prompt');
        e.preventDefault();
      }
    });

    clearBtn.addEventListener('click', () => {
      if (clearBtn.disabled) return;
      const oldVal = input.value;
      input.value = '';
      updateCountersAndHints();
      clearStatusBanner();
      showUndo(oldVal, 'Cleared prompt');
      input.focus();
    });

    pills.forEach(pill => {
      pill.addEventListener('click', () => {
        if (pill.disabled) return;
        const oldVal = input.value;
        input.value = pill.getAttribute('data-value');
        updateCountersAndHints();
        clearStatusBanner();
        if (oldVal && oldVal.trim() !== '') {
          showUndo(oldVal, 'Replaced prompt');
        } else {
          hideUndo();
        }
        input.focus();
      });
    });

    undoBtn.addEventListener('click', () => {
      if (undoBtn.disabled) return;
      input.value = previousValue;
      updateCountersAndHints();
      clearStatusBanner();
      hideUndo();
      input.focus();
    });

    const isMac = /Mac|iPhone|iPod|iPad/i.test(navigator.platform || navigator.userAgent);
    if (isMac && undoShortcut) {
      undoShortcut.textContent = '⌘Z';
    }

    document.addEventListener('keydown', (e) => {
      if (undoContainer.style.display === 'flex' && !undoBtn.disabled) {
        const isUndoKey = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z';
        if (isUndoKey) {
          e.preventDefault();
          undoBtn.click();
        }
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (btn.disabled) return;

      btn.disabled = true;
      input.disabled = true;
      clearBtn.disabled = true;
      undoBtn.disabled = true;
      bannerCloseBtn.disabled = true;
      pills.forEach(p => p.disabled = true);
      hideUndo();

      btn.innerHTML = '<span class="spinner" aria-hidden="true"></span> Generating...';
      btn.setAttribute('aria-label', 'Generating video, please wait');
      banner.classList.remove('show');
      banner.style.display = 'none';
      setTimeout(() => {
        btn.disabled = false;
        input.disabled = false;
        clearBtn.disabled = false;
        undoBtn.disabled = false;
        bannerCloseBtn.disabled = false;
        pills.forEach(p => p.disabled = false);

        btn.innerHTML = 'Generate Video';
        btn.setAttribute('aria-label', 'Generate video');
        successMsg.textContent = '✨ AI video cuts generated successfully!';
        banner.style.display = 'flex';
        // Force reflow for transitioning from display: none to flex with transitions
        void banner.offsetWidth;
        banner.classList.add('show');
      }, 1200);
    });
  </script>
</body>
</html>
